name: Vasovagal Syncope Daily Report

on:
  schedule:
    - cron: "55 0 * * *" # UTC 00:55 = GMT+8 08:55
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
          echo "Date: $(grep target <<< "$(cat "$GITHUB_OUTPUT")" | cut -d= -f2)"

      - name: Check if report already exists
        id: check
        run: |
          TARGET="${{ steps.date.outputs.target }}"
          if [ -f "docs/vasovagal-${TARGET}.html" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Report for $TARGET already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch papers from PubMed
        if: steps.check.outputs.exists == 'false'
        run: |
          python scripts/fetch_papers.py \
            --days 7 \
            --max-papers 40 \
            --json \
            --output papers.json
        continue-on-error: true
        timeout-minutes: 5

      - name: Check papers data
        if: steps.check.outputs.exists == 'false'
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(python -c "import json; print(json.load(open('papers.json')).get('count',0))")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            TARGET="${{ steps.date.outputs.target }}"
            echo "{\"date\":\"${TARGET}\",\"count\":0,\"papers\":[]}" > papers.json
            echo "No papers found, will generate empty report"
          fi

      - name: Filter unsibscribed papers
        if: steps.check.outputs.exists == 'false'
        id: filter
        run: |
          python -c "
          import json, glob, re, sys
          from datetime import datetime, timedelta, timezone

          with open('papers.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          summarized_pmids = set()
          tz = timezone(timedelta(hours=8))
          cutoff = (datetime.now(tz) - timedelta(days=7)).strftime('%Y-%m-%d')

          for html_file in sorted(glob.glob('docs/vasovagal-*.html'), reverse=True)[:7]:
              fname = html_file.replace('docs/vasovagal-', '').replace('.html', '')
              try:
                  file_date = datetime.strptime(fname, '%Y-%m-%d').strftime('%Y-%m-%d')
              except ValueError:
                  continue
              if file_date < cutoff:
                  break
              with open(html_file, 'r', encoding='utf-8') as f:
                  content = f.read()
              found = set(re.findall(r'pubmed\.ncbi\.nlm\.nih\.gov/(\d+)', content))
              summarized_pmids.update(found)

          if summarized_pmids:
              before = len(data.get('papers', []))
              data['papers'] = [p for p in data.get('papers', []) if p.get('pmid', '') not in summarized_pmids]
              data['count'] = len(data['papers'])
              after = len(data['papers'])
              print(f'Filtered: {before} -> {after} papers (removed {before - after} already summarized)', file=sys.stderr)

          with open('papers.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f'count={data[\"count\"]}')
          " 2>&1
        timeout-minutes: 2

      - name: Generate report with Zhipu AI
        if: steps.check.outputs.exists == 'false'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python scripts/generate_report.py \
            --input papers.json \
            --output docs/vasovagal-${{ steps.date.outputs.target }}.html \
            --api-key "${ZHIPU_API_KEY}"
        timeout-minutes: 10

      - name: Generate index page
        if: steps.check.outputs.exists == 'false'
        run: python scripts/generate_index.py

      - name: Commit and push
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📄 vasovagal syncope daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### 💓 Vasovagal Syncope Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [vasovagal-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/vasovagal-syncope/vasovagal-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
